<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Win95 beveled outer border -->
  <rect x="0" y="0" width="32" height="32" fill="#c0c0c0"/>
  <rect x="0" y="0" width="31" height="1" fill="#ffffff"/>
  <rect x="0" y="0" width="1" height="31" fill="#ffffff"/>
  <rect x="31" y="1" width="1" height="31" fill="#404040"/>
  <rect x="1" y="31" width="31" height="1" fill="#404040"/>
  <rect x="30" y="2" width="1" height="29" fill="#808080"/>
  <rect x="2" y="30" width="29" height="1" fill="#808080"/>

  <!-- Inner sunken panel -->
  <rect x="3" y="3" width="26" height="26" fill="#808080"/>
  <rect x="4" y="4" width="25" height="1" fill="#404040"/>
  <rect x="3" y="3" width="1" height="25" fill="#404040"/>
  <rect x="4" y="4" width="24" height="24" fill="#000080"/>

  <!-- Pixel-art Rupee symbol (₹) in green on navy -->
  <!-- Top horizontal bar -->
  <rect x="9" y="7" width="14" height="2" fill="#00ff00"/>
  <!-- Second horizontal bar -->
  <rect x="9" y="11" width="14" height="2" fill="#00ff00"/>
  <!-- Vertical stem -->
  <rect x="13" y="9" width="2" height="2" fill="#00ff00"/>
  <!-- Diagonal leg going down-right -->
  <rect x="13" y="13" width="2" height="2" fill="#00ff00"/>
  <rect x="15" y="15" width="2" height="2" fill="#00ff00"/>
  <rect x="17" y="17" width="2" height="2" fill="#00ff00"/>
  <rect x="19" y="19" width="2" height="2" fill="#00ff00"/>
  <rect x="21" y="21" width="2" height="2" fill="#00ff00"/>
  <!-- Small upward curve accent -->
  <rect x="15" y="9" width="2" height="2" fill="#00ff00"/>
  <rect x="17" y="8" width="2" height="2" fill="#00ff00"/>
  <rect x="19" y="7" width="2" height="2" fill="#00ff00"/>

  <!-- Pixel sparkle/star accent (top-right) -->
  <rect x="24" y="6" width="2" height="2" fill="#ffff00"/>
  <rect x="22" y="8" width="2" height="2" fill="#ffff00"/>
  <rect x="26" y="8" width="1" height="1" fill="#ffff00"/>
</svg>